services:
  - type: web
    name: singularity-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render.Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: SINGULARITY_ORIGINS
        value: https://singularity-api-7ptj.onrender.com
